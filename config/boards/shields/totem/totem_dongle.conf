CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Let the dongle output HID over Bluetooth to a host in addition to talking
# to the two keyboard halves. Formula: peripherals (2) + BT profiles (5) = 7.
# Must only be set on the central (dongle).
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Battery reporting over USB (Genteure/zmk feat/battery-reporting, PR #2938).
# Dongle fetches both halves' levels and reports the lowest as one battery
# over USB HID -> Linux exposes it as /sys/class/power_supply/hid-*-battery.
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_PROXY=y
CONFIG_ZMK_BATTERY_REPORTING_USB=y

CONFIG_ZMK_SLEEP=n

