CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Let the dongle output HID over Bluetooth to a host in addition to talking
# to the two keyboard halves. Formula: peripherals (2) + BT profiles (5) = 7.
# Must only be set on the central (dongle).
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

CONFIG_ZMK_SLEEP=n

